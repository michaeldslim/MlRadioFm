name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Build MlRadioFm .app (Release)
        run: |
          xcodebuild \
            -project MlRadioFm.xcodeproj \
            -scheme MlRadioFm \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            clean build

      - name: List build products (for debugging)
        run: |
          ls -R build/Build/Products || echo "No build products found"

      - name: Package MlRadioFm.app into zip
        run: |
          cd build/Build/Products/Release
          zip -r MlRadioFm.app.zip MlRadioFm.app

      - name: Upload MlRadioFm.app.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: MlRadioFm-macOS-Release
          path: build/Build/Products/Release/MlRadioFm.app.zip
